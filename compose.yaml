services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:80"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vega-postgres:/var/lib/postgresql/data

volumes:
  vega-postgres:
